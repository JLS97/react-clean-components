# Integración continua: cada push y cada pull request compila la app, pasa los tests JVM del núcleo
# criptográfico y el lint de Android, y publica los informes. La verificación de dependencias
# (gradle/verification-metadata.xml) está activa, así que cualquier artefacto distinto del registrado
# hace fallar el trabajo. Aquí no hay clave de firma: la release se firma siempre en local
# (ver docs/RELEASE.md). Cada acción se fija al SHA completo de su commit (un tag es mutable y una
# cuenta comprometida podría cambiarlo sin tocar este repositorio); el tag queda como comentario para
# que Dependabot (.github/dependabot.yml) proponga las versiones nuevas.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint y APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle con caché
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1  # v4.4.4
        with:
          # Solo la rama principal escribe en la caché; las PR la leen.
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Tests, lint y APK debug
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest lintDebug assembleDebug

      # La lista de navegadores de confianza caduca por calendario (TrustedBrowsers.LIST_DATE más
      # MAX_LIST_AGE_MONTHS), no por un cambio del código, así que no vive en un test unitario que
      # pondría la suite en rojo un día fijo: este paso avisa (anotación de GitHub y paso en rojo)
      # sin hacer fallar el trabajo. La regla en sí se prueba con fechas fijas en AutofillLogicTest.
      - name: Antigüedad de la lista de navegadores de confianza
        continue-on-error: true
        run: |
          file=app/src/main/java/io/github/jls97/boveda/core/autofill/TrustedBrowsers.kt
          list_date=$(sed -n 's/^ *const val LIST_DATE = "\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)".*/\1/p' "$file")
          max_months=$(sed -n 's/^ *const val MAX_LIST_AGE_MONTHS = \([0-9]\+\).*/\1/p' "$file")
          test -n "$list_date" && test -n "$max_months"
          limit=$(date -u -d "$list_date + $max_months months" +%F)
          today=$(date -u +%F)
          echo "Lista de navegadores del $list_date; caduca el $limit (hoy es $today)"
          if [ "$today" \> "$limit" ]; then
            echo "::warning file=$file::La lista de navegadores de confianza (LIST_DATE = $list_date) tiene más de $max_months meses: regenérala desde fido2_privileged_google.json, cúrala y actualiza LIST_DATE, EXPECTED_SIZE y el README"
            exit 1
          fi

      - name: Publicar informes de tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: informes-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publicar informe de lint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: informe-lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
          if-no-files-found: ignore

      - name: Publicar APK debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
