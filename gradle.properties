# Project-wide Gradle settings.
# https://docs.gradle.org/current/userguide/build_environment.html
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# Verificación de dependencias: toda descarga (artefactos, POM, plugins) debe coincidir con la suma
# SHA-256 registrada en gradle/verification-metadata.xml; si no, la build falla. Para aceptar una
# versión nueva: ./gradlew --no-daemon --write-verification-metadata sha256 help testDebugUnitTest
# y revisar el diff del XML antes de versionarlo. Ver docs/RELEASE.md.
org.gradle.dependency.verification=strict

# Kotlin code style for this project: "official" or "obsolete".
kotlin.code.style=official
